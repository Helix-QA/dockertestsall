services:
  va-test-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/onec-vanessa:8.5.1.1529
    container_name: va-runner-1
    environment:
      - DISPLAY=:99
      - WEBKIT_DISABLE_COMPOSITING_MODE=1
      - LIBGL_ALWAYS_SOFTWARE=1
    extra_hosts:
      - "DESKTOP-BIF25NH:host-gateway"
    ports:
      - "5901:5900"
    volumes:
      - ./config:/workspace/config:ro
      - ./features/test1:/workspace/features:ro
      - ./build/test1:/workspace/build
    command: vrunner vanessa --settings /workspace/config/vrunner.json

  va-test-2:
    image: local/onec-vanessa:8.5.1.1529
    container_name: va-runner-2
    environment:
      - DISPLAY=:98
      - WEBKIT_DISABLE_COMPOSITING_MODE=1
      - LIBGL_ALWAYS_SOFTWARE=1
    extra_hosts:
      - "DESKTOP-BIF25NH:host-gateway"
    ports:
      - "5902:5900"
    volumes:
      - ./config:/workspace/config:ro
      - ./features/test2:/workspace/features:ro
      - ./build/test2:/workspace/build
    command: vrunner vanessa --settings /workspace/config/vrunner.json